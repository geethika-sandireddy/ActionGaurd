name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-selfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Self-scan using the packaged ActionGuard action (dogfooding)
        uses: ./
        with:
          path: '.'
          fail-on: 'CRITICAL'
          sarif: 'actionguard-results.sarif'

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: actionguard-results.sarif
        continue-on-error: true
