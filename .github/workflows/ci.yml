name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-selfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Scan this repo's own workflows (dogfooding)
        run: python -m actionguard.cli . --fail-on CRITICAL
